# The factory's entrypoint. Client stubs call this at the version they pin; never run it directly.
name: router

on:
  workflow_call:
    inputs:
      stub-version:
        description: The version the calling stub declares.
        type: string
        required: false
    secrets:
      FACTORY_TOKEN:
        required: false
      FACTORY_CHECK_ENV:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      CODEX_ACCESS_TOKEN:
        required: false
      CODEX_POOL_TOKEN:
        required: false
      CODEX_POOL_TRANSPORT_PRIVATE_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false

# One run per subject at a time, queued in order rather than dropped (§7).
concurrency:
  group: factory-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.client_payload.number || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.route.outputs.decision }}
      task: ${{ steps.route.outputs.task }}
      agent-job: ${{ steps.route.outputs.agent-job }}
      head-sha: ${{ steps.route.outputs.head-sha }}
      base-ref: ${{ steps.route.outputs.base-ref }}
      doctor-agents: ${{ steps.route.outputs.doctor-agents }}
      warm-agents: ${{ steps.route.outputs.warm-agents }}
      codex-pool: ${{ steps.route.outputs.codex-pool }}
      factory-repository: ${{ steps.factory.outputs.repository }}
      factory-sha: ${{ steps.factory.outputs.sha }}
    steps:
      # The default ref: the default branch, or a PR's base branch. Never PR code.
      - name: Check out the client repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # job.workflow_* are read here only, on ubuntu-latest, and passed on as outputs (#29).
      - name: Fetch the factory at the pinned commit
        id: factory
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
          SERVER: ${{ github.server_url }}
        run: |
          dir="$RUNNER_TEMP/actions-factory"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$SERVER/$REPOSITORY" "$SHA"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          {
            echo "root=$dir"
            echo "repository=$REPOSITORY"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Route
        id: route
        env:
          FACTORY_ROOT: ${{ steps.factory.outputs.root }}
          FACTORY_SHA: ${{ steps.factory.outputs.sha }}
          STUB_VERSION: ${{ inputs.stub-version }}
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$FACTORY_ROOT/dist/router.js"

  # On the tick only: installs each configured agent's pinned CLI on a cache miss and saves it. Scheduled runs
  # may write the cache; label-triggered ones get a read-only cache (GitHub, 2026-06). The jobs that run agents
  # only restore: a save there would come after agent-written code ran, which could plant a tampered CLI.
  warm-agents:
    needs: route
    if: needs.route.outputs.warm-agents != '' && needs.route.outputs.warm-agents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.route.outputs.warm-agents) }}
    env:
      AGENT: ${{ matrix.agent }}
    steps:
      - name: Look for the cached CLI
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.factory-agents
          key: factory-agent-${{ matrix.agent }}-${{ matrix.cliVersion }}-${{ runner.os }}-${{ runner.arch }}
          lookup-only: true

      - name: Fetch the factory at the pinned commit
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REPOSITORY: ${{ needs.route.outputs.factory-repository }}
          SHA: ${{ needs.route.outputs.factory-sha }}
          SERVER: ${{ github.server_url }}
        run: |
          dir="$RUNNER_TEMP/actions-factory"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$SERVER/$REPOSITORY" "$SHA"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_ROOT=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Install the CLI
        if: steps.cache.outputs.cache-hit != 'true'
        run: node "$FACTORY_ROOT/dist/agent.js" install

      - name: Save it
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.factory-agents
          key: factory-agent-${{ matrix.agent }}-${{ matrix.cliVersion }}-${{ runner.os }}-${{ runner.arch }}

  # The doctor's agent check, one job per agent the config uses. Each holds only its own agent's credentials, and
  # no GitHub token. Runs even when the route job's checks failed, so every problem shows in one go.
  doctor-agent:
    needs: route
    if: always() && needs.route.outputs.doctor-agents != '' && needs.route.outputs.doctor-agents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.route.outputs.doctor-agents) }}
    env:
      AGENT: ${{ matrix.agent }}
    steps:
      - name: Fetch the factory at the pinned commit
        env:
          REPOSITORY: ${{ needs.route.outputs.factory-repository }}
          SHA: ${{ needs.route.outputs.factory-sha }}
          SERVER: ${{ github.server_url }}
        run: |
          dir="$RUNNER_TEMP/actions-factory"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$SERVER/$REPOSITORY" "$SHA"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_ROOT=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache the agent CLI
        if: matrix.cliVersion != 'none'
        uses: actions/cache/restore@v4
        with:
          path: ~/.factory-agents
          key: factory-agent-${{ matrix.agent }}-${{ matrix.cliVersion }}-${{ runner.os }}-${{ runner.arch }}

      - name: Check the agent
        env:
          ANTHROPIC_API_KEY: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.agent == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENAI_API_KEY: ${{ matrix.agent == 'codex' && secrets.OPENAI_API_KEY || '' }}
          CODEX_ACCESS_TOKEN: ${{ matrix.agent == 'codex' && secrets.CODEX_ACCESS_TOKEN || '' }}
          COPILOT_GITHUB_TOKEN: ${{ matrix.agent == 'copilot' && secrets.COPILOT_GITHUB_TOKEN || '' }}
        run: node "$FACTORY_ROOT/dist/agent.js" doctor

  # The nested call gets the agent credentials, not secrets for the save-back job.
  agent:
    needs: route
    if: needs.route.outputs.task != ''
    uses: ./.github/workflows/agent.yml
    with:
      decision: ${{ needs.route.outputs.decision }}
      agent-job: ${{ needs.route.outputs.agent-job }}
      head-sha: ${{ needs.route.outputs.head-sha }}
      base-ref: ${{ needs.route.outputs.base-ref }}
      factory-repository: ${{ needs.route.outputs.factory-repository }}
      factory-sha: ${{ needs.route.outputs.factory-sha }}
      codex-pool: ${{ needs.route.outputs.codex-pool == 'true' }}
    secrets:
      FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
      FACTORY_CHECK_ENV: ${{ secrets.FACTORY_CHECK_ENV }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  # Holds CODEX_POOL_TOKEN and the transport private key. Runs factory code only, never the agent's.
  pool-save:
    needs: [route, agent]
    if: always() && needs.route.outputs.codex-pool == 'true' && needs.route.outputs.task != ''
    runs-on: ubuntu-latest
    environment: codex-pool
    steps:
      - name: Fetch the factory at the pinned commit
        env:
          REPOSITORY: ${{ needs.route.outputs.factory-repository }}
          SHA: ${{ needs.route.outputs.factory-sha }}
          SERVER: ${{ github.server_url }}
        run: |
          dir="$RUNNER_TEMP/actions-factory"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$SERVER/$REPOSITORY" "$SHA"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the sealed logins
        id: sealed
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: factory-pool-handoff
          path: ${{ runner.temp }}/pool-handoff

      # A just-uploaded artifact is sometimes not yet listed: wait and try once more, before a missing one quarantines a login.
      - name: Wait before retrying the download
        if: steps.sealed.outcome == 'failure'
        run: sleep 20

      - name: Download the sealed logins again
        if: steps.sealed.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: factory-pool-handoff
          path: ${{ runner.temp }}/pool-handoff

      - name: Save the logins back
        env:
          FACTORY_ROOT: ${{ runner.temp }}/actions-factory
          POOL_HANDOFF_DIR: ${{ runner.temp }}/pool-handoff
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          CODEX_POOL_TOKEN: ${{ secrets.CODEX_POOL_TOKEN }}
          CODEX_POOL_TRANSPORT_PRIVATE_KEY: ${{ secrets.CODEX_POOL_TRANSPORT_PRIVATE_KEY }}
          CODEX_POOL_SECRETS: ${{ toJSON(secrets) }}
        run: node "$FACTORY_ROOT/dist/apply.js" pool-save

  # Runs even when the agent job failed, so the item is parked with agent:blocked and a status comment.
  apply:
    needs: [route, agent]
    if: always() && needs.route.outputs.task != ''
    runs-on: ubuntu-latest
    steps:
      # A PR task works on the PR's head (same-repo only: forks are refused before this), with full history so the
      # merge task can merge the base in. Everything else works on the default branch.
      - name: Check out the client repo
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.route.outputs.head-sha }}
          fetch-depth: ${{ needs.route.outputs.head-sha != '' && 0 || 1 }}
          persist-credentials: false

      # The PR's base branch: the config comes from it, outside the work tree, so a PR can't change the rules it
      # runs under; and it's fetched into the work clone as origin/<base>, for the merge task.
      - name: Check out the pull request's base
        if: needs.route.outputs.head-sha != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.route.outputs.base-ref }}
          path: .factory-base
          fetch-depth: 0
          persist-credentials: false

      - name: Take the config from the base
        if: needs.route.outputs.head-sha != ''
        env:
          BASE_REF: ${{ needs.route.outputs.base-ref }}
        run: |
          git fetch -q ./.factory-base "+HEAD:refs/remotes/origin/$BASE_REF"
          mv .factory-base "$RUNNER_TEMP/factory-base"
          echo "FACTORY_CONFIG_ROOT=$RUNNER_TEMP/factory-base" >> "$GITHUB_ENV"

      - name: Fetch the factory at the pinned commit
        env:
          REPOSITORY: ${{ needs.route.outputs.factory-repository }}
          SHA: ${{ needs.route.outputs.factory-sha }}
          SERVER: ${{ github.server_url }}
        run: |
          dir="$RUNNER_TEMP/actions-factory"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$SERVER/$REPOSITORY" "$SHA"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the handoff
        id: handoff
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: factory-handoff
          path: ${{ runner.temp }}/handoff

      # A just-uploaded artifact is sometimes not yet listed (seen seconds after upload): wait and try once more.
      - name: Wait before retrying the download
        if: steps.handoff.outcome == 'failure'
        run: sleep 20

      - name: Download the handoff again
        if: steps.handoff.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: factory-handoff
          path: ${{ runner.temp }}/handoff

      - name: Apply
        env:
          DECISION: ${{ needs.route.outputs.decision }}
          FACTORY_ROOT: ${{ runner.temp }}/actions-factory
          HANDOFF_DIR: ${{ runner.temp }}/handoff
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: node "$FACTORY_ROOT/dist/apply.js"
